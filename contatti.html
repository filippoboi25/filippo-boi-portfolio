<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!-- Prima del primo paint: html.js abilita gli stati iniziali delle animazioni,
       vt-in segnala un cambio pagina con View Transition, e se motion.js non parte
       entro 3 s motion-off mostra tutto il contenuto. -->
  <script>(function(h){h.classList.add('js');try{if(sessionStorage.getItem('fb-vt')){h.classList.add('vt-in');sessionStorage.removeItem('fb-vt')}}catch(e){}setTimeout(function(){if(!h.classList.contains('motion-ready'))h.classList.add('motion-off')},3000)})(document.documentElement);</script>
